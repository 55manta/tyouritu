<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>調律ノート</title>
<style>
:root { --ground:#F4F2EC; --ink:#1E1C17; --ink2:#5E594F; }
@media (prefers-color-scheme: dark) { :root { --ground:#12110D; --ink:#F2EFE6; --ink2:#B0A999; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--ground); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; line-height:1.8; padding:24px; }
h1 { font-size:22px; font-weight:800; margin:0 0 6px; }
p { color:var(--ink2); font-size:14.5px; margin:0; max-width:34em; }
</style>
</head>
<body>
<div>
  <h1>調律ノート</h1>
  <p>ピアノ調律師のための台帳アプリです。お客様へのご案内は、調律師からお送りするリンクからお開きください。</p>
</div>
</body>
</html>
